# CI: lint + test on the synthetic fixture, then confirm the Docker image
# builds and actually runs, then publish it. Deliberately does NOT run
# src/train.py against real data — the proprietary Ampliphi extract is
# never committed to this repo (see README), so there's nothing for a
# hosted runner to train on. Everything here runs against
# tests/conftest.py's synthetic fixture instead, which is the point: the
# pipeline is exercised on every push without the real dataset ever needing
# to exist outside a laptop with the extract on it.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: pytest -q --cov=src --cov-report=term-missing --cov-report=xml
      - name: dependency vulnerability scan
        run: pip-audit -r requirements.txt -r requirements-dev.txt
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t booking-curve-service:${{ github.sha }} .
      - name: smoke-test the image starts and reports unready without a model
        run: |
          docker run -d --name smoke -p 8000:8000 booking-curve-service:${{ github.sha }}
          sleep 3
          curl -sf http://localhost:8000/livez
          # /readyz is expected to be 503 here: no artifacts/model volume is
          # mounted in this smoke test, so there's no model to load. That's
          # the correct behavior, not a failure — a real deploy mounts the
          # model artifact; see the Dockerfile's own `docker run` examples.
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/readyz)
          test "$status" = "503"
          docker logs smoke
          docker stop smoke

  publish:
    # Only on main, and only after both checks above pass — this is the
    # promotion gate. Pushes to ghcr.io using the workflow's own built-in
    # GITHUB_TOKEN (repo Settings > Actions > enable "Read and write
    # permissions" for it once) — no external registry account or secret
    # to provision. This publishes the PRODUCTION image (no data baked
    # in, mounted volumes only — see Dockerfile's own comment); it is not
    # itself runnable standalone. See DESIGN.md SS6.5 for the shadow ->
    # canary -> rollout path a real deploy of this image would go through.
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build-and-smoke-test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/booking-curve-service
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  publish-and-deploy-demo:
    # A SEPARATE image (Dockerfile.demo) from the one above: this one
    # bakes in the synthetic demo dataset and a model trained on it at
    # build time, specifically so it can run standalone on a public
    # endpoint with no volume mount available. The real Ampliphi extract
    # is never in this job's reach — it isn't checked into the repo this
    # runner checked out, same as every other CI job here.
    #
    # This is real continuous deployment, not just continuous delivery:
    # every merge to main that passes lint-and-test and the smoke test
    # rebuilds the demo image and redeploys it to the live Cloud Run URL,
    # with no manual step. Auth is a GCP service-account key in
    # GCP_SA_KEY (repo secret) -- the simpler of the two standard options;
    # Workload Identity Federation (no long-lived key at all) is what a
    # real production pipeline should use instead, noted here rather than
    # built, since it needs its own GCP-side trust-pool setup this
    # project's scale doesn't yet justify.
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build-and-smoke-test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + smoke-test the demo image before pushing anywhere
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/booking-curve-service
          docker build -f Dockerfile.demo -t "$IMAGE:demo-${{ github.sha }}" -t "$IMAGE:demo" .
          docker run -d --name demo-smoke -p 8000:8000 "$IMAGE:demo"
          for i in $(seq 1 20); do curl -sf http://localhost:8000/readyz && break; sleep 1; done
          curl -sf http://localhost:8000/readyz
          curl -sf "http://localhost:8000/v1/booking-curve?hotel_id=hotel_X&room_type_code=rt_x1&stay_date=2025-08-15"
          docker stop demo-smoke
      - run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/booking-curve-service
          docker push "$IMAGE:demo-${{ github.sha }}"
          docker push "$IMAGE:demo"
      - uses: google-github-actions/auth@v3
        if: ${{ vars.GCP_PROJECT_ID != '' }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/deploy-cloudrun@v3
        if: ${{ vars.GCP_PROJECT_ID != '' }}
        with:
          service: booking-curve-service-demo
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          image: ghcr.io/${{ github.repository_owner }}/booking-curve-service:demo-${{ github.sha }}
          flags: "--port=8000 --allow-unauthenticated --min-instances=0 --max-instances=2 --memory=512Mi"
