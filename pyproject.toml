[project]
name = "booking-curve-service"
version = "0.1.0"
description = "Ampliphi booking-curve forecasting service"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E501 (line-too-long) off: several data/design comments run long on
# purpose to keep the reasoning next to the code they explain, rather than
# split mid-sentence to satisfy a column count.
select = ["E", "F", "W", "I"]
ignore = ["E501"]
